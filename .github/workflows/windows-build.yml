name: Build Windows binaries
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build x86 and x64 binaries
        shell: pwsh
        run: .\build.ps1
      - name: Upload binaries and source notices
        uses: actions/upload-artifact@v4
        with:
          name: GameAudioBridge-1.0-build-GPLv3
          path: dist/
          if-no-files-found: error
